# This template contains jobs to run UI tests using WinAppDriver.

parameters:
  configuration: ''

jobs:
- job: UITests${{ parameters.configuration }}
  displayName: Build and run UI Tests - ${{ parameters.configuration }}
  condition: succeeded()
  pool:
    name: $(a11yInsightsPool)
    image: windows-2022-secure
    os: windows
  templateContext:
    settings:
      networkIsolationPolicy: Permissive,CFSClean
  steps:
  - task: NuGetToolInstaller@1
    displayName: 'Use NuGet 5.x'
    inputs:
      versionSpec: '5.x'

  # Authenticate to the private Azure Artifacts feed defined in nuget.config
  - task: NuGetAuthenticate@1
    displayName: 'Authenticate to NuGet feeds'

  - task: NuGetCommand@2
    displayName: 'NuGet restore'
    inputs:
      command: restore
      restoreSolution: '**/*.sln'
      feedsToUse: config
      nugetConfigPath: '$(Build.SourcesDirectory)/src/nuget.config'

  - task: VSBuild@1
    displayName: 'Build Solution **\*.sln'
    inputs:
      vsVersion: 17.0
      platform: '$(BuildPlatform)'
      configuration: ${{ parameters.configuration }}
      # Force the implicit MSBuild restore to use the same nuget.config.
      # Without this, VSBuild falls back to api.nuget.org.
      msbuildArgs: '/p:RestoreConfigFile=$(Build.SourcesDirectory)/src/nuget.config'

  - task: WinAppDriver.winappdriver-pipelines-task.winappdriver-pipelines-task.Windows Application Driver@0
    displayName: 'Start - WinAppDriver'
    inputs:
      AgentResolution: 1080p

  - task: VSTest@2
    displayName: 'Test Assemblies **\release\*test*.dll;-:**\obj\**'
    inputs:
      testAssemblyVer2: |
        **\*test*.dll
        !**\obj\**
      platform: '$(BuildPlatform)'
      configuration: ${{ parameters.configuration }}
      runSettingsFile: $(Build.SourcesDirectory)/src/UITests//UITests.runsettings
      testFiltercriteria: 'TestCategory=Integration&TestCategory!=LiveMode'
      rerunFailedTests: true
      rerunType: basedOnTestFailureCount
      rerunFailedTestCasesMaxLimit: 100 # Rerun even if all UI tests fail on a given run (much larger than count of tests)

  - task: WinAppDriver.winappdriver-pipelines-task.winappdriver-pipelines-task.Windows Application Driver@0
    displayName: 'Stop - WinAppDriver'
    continueOnError: true
    inputs:
      OperationType: Stop