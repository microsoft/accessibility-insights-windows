  steps:
  - task: NuGetToolInstaller@1
    displayName: 'Use NuGet 5.x'
    inputs:
      versionSpec: '5.x'

  - task: NuGetAuthenticate@1
    displayName: 'Authenticate to NuGet feeds'

  - task: NuGetCommand@2
    displayName: 'NuGet restore'
    inputs:
      feedsToUse: config
      nugetConfigPath: '$(Build.SourcesDirectory)/src/nuget.config'

  - task: PowerShell@2
    displayName: 'Check ClearlyDefined'
    inputs:
      filePath: '$(Build.SourcesDirectory)\tools\scripts\pipeline\build\clearly-defined\check-clearly-defined.ps1'
      arguments: '-Verbose -PipelineType ado'